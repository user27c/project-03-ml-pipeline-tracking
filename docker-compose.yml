version: '3.8'

# ML Pipeline Infrastructure with MLflow, Airflow, PostgreSQL, MinIO, and Redis

services:
  # ============================================================================
  # PostgreSQL Database
  # Used by: MLflow (backend store), Airflow (metadata DB)
  # ============================================================================
  postgres:
    image: postgres:15
    container_name: ml_pipeline_postgres
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ml_pipeline_network

  # ============================================================================
  # MinIO Object Storage
  # S3-compatible storage for MLflow artifacts and DVC
  # ============================================================================
  minio:
    image: minio/minio:latest
    container_name: ml_pipeline_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - ml_pipeline_network

  # ============================================================================
  # MLflow Tracking Server
  # Central experiment tracking and model registry
  # ============================================================================
  mlflow:
    build:
      context: .
      dockerfile: mlflow/Dockerfile
    container_name: ml_pipeline_mlflow
    ports:
      - "5000:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://mlflow:mlflow@postgres:5432/mlflow
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      MLFLOW_SERVER_ALLOWED_HOSTS: mlflow,localhost,127.0.0.1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      # MinIO 需 path-style，否则 MLflow UI 常出现「已上传但 Artifacts 列表为空」
      AWS_S3_ADDRESSING_STYLE: path
      # boto3 在部分环境下需要 region 才能正确生成/解析请求（否则 UI 取 artifact 可能 500）
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      mlflow server
      --backend-store-uri postgresql://mlflow:mlflow@postgres:5432/mlflow
      --default-artifact-root s3://mlflow/
      --host 0.0.0.0
      --allowed-hosts mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000
      --port 5000
    networks:
      - ml_pipeline_network

  # ============================================================================
  # Redis Message Broker
  # Used by: Airflow Celery Executor
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: ml_pipeline_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ml_pipeline_network

  # ============================================================================
  # Airflow Webserver
  # UI and REST API for workflow management
  # ============================================================================
  airflow-webserver:
    build:
      context: .
      dockerfile: ./airflow/Dockerfile
    image: ml-pipeline-airflow:local
    container_name: ml_pipeline_airflow_webserver
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql://mlflow:mlflow@postgres:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://mlflow:mlflow@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: 'RiVQihR6Dj5AmGK_ygBAMplD4GFK5rc-AAFGkCvMMtU='
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'      
      AIRFLOW__WEBSERVER__SECRET_KEY: '_IsrGsL6TgSHsrCwXjkdz4PlKqUv-oCz24qj4hsczpQ'
      ML_PIPELINE_PROJECT_ROOT: /opt/airflow
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_S3_ADDRESSING_STYLE: path
      MAIL_SMTP_HOST: smtp.qq.com
      MAIL_SMTP_PORT: "465"
      MAIL_SMTP_MODE: ${MAIL_SMTP_MODE:-auto}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      ML_PIPELINE_ALERT_EMAIL: ${ML_PIPELINE_ALERT_EMAIL:-}
      ML_PIPELINE_REUSE_TRAIN_CACHE: ${ML_PIPELINE_REUSE_TRAIN_CACHE:-false}
      ML_PIPELINE_TRAIN_SAMPLE_RATIO: ${ML_PIPELINE_TRAIN_SAMPLE_RATIO:-0.2}
      ML_PIPELINE_MODEL_NAME: ${ML_PIPELINE_MODEL_NAME:-mobilenet_v2}
      ML_PIPELINE_NUM_EPOCHS: ${ML_PIPELINE_NUM_EPOCHS:-2}
      ML_PIPELINE_BATCH_SIZE: ${ML_PIPELINE_BATCH_SIZE:-64}
      ML_PIPELINE_EARLY_STOPPING_PATIENCE: ${ML_PIPELINE_EARLY_STOPPING_PATIENCE:-1}
      FEATURE_STORE_POSTGRES_HOST: postgres
      FEATURE_STORE_POSTGRES_DB: mlflow
      FEATURE_STORE_POSTGRES_USER: mlflow
      FEATURE_STORE_POSTGRES_PASSWORD: mlflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./models:/opt/airflow/models
      - ./artifacts:/opt/airflow/artifacts
      - airflow_logs:/opt/airflow/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: webserver
    networks:
      - ml_pipeline_network

  # ============================================================================
  # Airflow Scheduler
  # Schedules and triggers DAG runs
  # ============================================================================
  airflow-scheduler:
    image: ml-pipeline-airflow:local
    container_name: ml_pipeline_airflow_scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql://mlflow:mlflow@postgres:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://mlflow:mlflow@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: 'RiVQihR6Dj5AmGK_ygBAMplD4GFK5rc-AAFGkCvMMtU='
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      ML_PIPELINE_PROJECT_ROOT: /opt/airflow
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_S3_ADDRESSING_STYLE: path
      MAIL_SMTP_HOST: smtp.qq.com
      MAIL_SMTP_PORT: "465"
      MAIL_SMTP_MODE: ${MAIL_SMTP_MODE:-auto}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      ML_PIPELINE_ALERT_EMAIL: ${ML_PIPELINE_ALERT_EMAIL:-}
      ML_PIPELINE_REUSE_TRAIN_CACHE: ${ML_PIPELINE_REUSE_TRAIN_CACHE:-false}
      ML_PIPELINE_TRAIN_SAMPLE_RATIO: ${ML_PIPELINE_TRAIN_SAMPLE_RATIO:-0.2}
      ML_PIPELINE_MODEL_NAME: ${ML_PIPELINE_MODEL_NAME:-mobilenet_v2}
      ML_PIPELINE_NUM_EPOCHS: ${ML_PIPELINE_NUM_EPOCHS:-2}
      ML_PIPELINE_BATCH_SIZE: ${ML_PIPELINE_BATCH_SIZE:-64}
      ML_PIPELINE_EARLY_STOPPING_PATIENCE: ${ML_PIPELINE_EARLY_STOPPING_PATIENCE:-1}
      FEATURE_STORE_POSTGRES_HOST: postgres
      FEATURE_STORE_POSTGRES_DB: mlflow
      FEATURE_STORE_POSTGRES_USER: mlflow
      FEATURE_STORE_POSTGRES_PASSWORD: mlflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./models:/opt/airflow/models
      - ./artifacts:/opt/airflow/artifacts
      - airflow_logs:/opt/airflow/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: scheduler
    networks:
      - ml_pipeline_network

  # ============================================================================
  # Airflow Worker
  # Executes tasks from the queue
  # ============================================================================
  airflow-worker:
    image: ml-pipeline-airflow:local
    container_name: ml_pipeline_airflow_worker
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql://mlflow:mlflow@postgres:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://mlflow:mlflow@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: 'RiVQihR6Dj5AmGK_ygBAMplD4GFK5rc-AAFGkCvMMtU='
      ML_PIPELINE_PROJECT_ROOT: /opt/airflow
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_S3_ADDRESSING_STYLE: path
      MAIL_SMTP_HOST: smtp.qq.com
      MAIL_SMTP_PORT: "465"
      MAIL_SMTP_MODE: ${MAIL_SMTP_MODE:-auto}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      ML_PIPELINE_ALERT_EMAIL: ${ML_PIPELINE_ALERT_EMAIL:-}
      ML_PIPELINE_REUSE_TRAIN_CACHE: ${ML_PIPELINE_REUSE_TRAIN_CACHE:-false}
      ML_PIPELINE_TRAIN_SAMPLE_RATIO: ${ML_PIPELINE_TRAIN_SAMPLE_RATIO:-0.2}
      ML_PIPELINE_MODEL_NAME: ${ML_PIPELINE_MODEL_NAME:-mobilenet_v2}
      ML_PIPELINE_NUM_EPOCHS: ${ML_PIPELINE_NUM_EPOCHS:-2}
      ML_PIPELINE_BATCH_SIZE: ${ML_PIPELINE_BATCH_SIZE:-64}
      ML_PIPELINE_EARLY_STOPPING_PATIENCE: ${ML_PIPELINE_EARLY_STOPPING_PATIENCE:-1}
      FEATURE_STORE_POSTGRES_HOST: postgres
      FEATURE_STORE_POSTGRES_DB: mlflow
      FEATURE_STORE_POSTGRES_USER: mlflow
      FEATURE_STORE_POSTGRES_PASSWORD: mlflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./models:/opt/airflow/models
      - ./artifacts:/opt/airflow/artifacts
      - airflow_logs:/opt/airflow/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery worker
    networks:
      - ml_pipeline_network

# ============================================================================
# Persistent Volumes
# ============================================================================
volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  airflow_logs:
    driver: local

# ============================================================================
# Network
# ============================================================================
networks:
  ml_pipeline_network:
    driver: bridge

# ============================================================================
# Usage Instructions
# ============================================================================
#
# 1. Start all services:
#    docker-compose up -d
#
# 2. Initialize Airflow database (first time only):
#    docker-compose exec airflow-webserver airflow db init
#    docker-compose exec airflow-webserver airflow users create \
#        --username admin \
#        --password admin \
#        --firstname Admin \
#        --lastname User \
#        --role Admin \
#        --email admin@example.com
#
# 3. Create MinIO bucket for MLflow (first time only):
#    Access MinIO Console at http://localhost:9001
#    Login with minioadmin/minioadmin
#    Create bucket named "mlflow"
#
# 4. Access UIs:
#    - MLflow: http://localhost:5000
#    - Airflow: http://localhost:8080 (admin/admin)
#    - MinIO Console: http://localhost:9001 (minioadmin/minioadmin)
#
# 5. Stop all services:
#    docker-compose down
#
# 6. Stop and remove volumes (WARNING: deletes all data):
#    docker-compose down -v
#
# ============================================================================